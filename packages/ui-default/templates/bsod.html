<!DOCTYPE html>
<html>
  <head>
    <title>System Error - Hydro</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        margin: 0;
        background: #f7f8fa;
        color: #1f2933;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        box-sizing: border-box;
        max-width: 720px;
        margin: 0 auto;
        padding: 96px 24px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 32px;
        font-weight: 650;
      }
      p {
        margin: 0 0 18px;
      }
      a {
        color: #1f6feb;
        text-decoration: none;
      }
      pre {
        margin-top: 24px;
        padding: 16px;
        overflow: auto;
        background: #111827;
        color: #e5e7eb;
        border-radius: 6px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>页面暂时无法打开</h1>
      <p>系统遇到了一个临时问题。你可以刷新页面，或者稍后再试。</p>
      <p><a href="javascript:window.location.reload()">刷新页面</a> · <a href="/">返回首页</a></p>
      {% if handler.user.hasPriv(PRIV.PRIV_EDIT_SYSTEM) %}
        <pre>{{ handler.request.hostname }}{{ handler.request.originalPath|default(handler.request.path) }}
{{ error.message }}
{{ error.stack }}</pre>
      {% endif %}
    </main>
  </body>
</html>
