services:
  # Warning: mongodb here is not password-protected.
  # DO NOT EXPOSE THIS SERVICE TO THE PUBLIC.
  oj-mongo:
    image: mongo:7-jammy
    container_name: oj-mongo
    restart: always
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  oj-backend:
    build:
      context: ../..
      dockerfile: install/docker/backend/Dockerfile
    container_name: oj-backend
    restart: always
    depends_on:
      oj-mongo:
        condition: service_healthy
        restart: true
    volumes:
      - ./data/file:/data/file
      - ./data/backend:/root/.hydro
    healthcheck:
      test: curl --silent --fail http://localhost:8888/status >/dev/null || exit 1
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

  oj-lsp:
    build:
      context: ../..
      dockerfile: install/docker/lsp/Dockerfile
    container_name: oj-lsp
    restart: always

  oj-proxy:
    image: nginx:1.27-alpine
    container_name: oj-proxy
    restart: always
    depends_on:
      oj-backend:
        condition: service_healthy
        restart: true
      oj-lsp:
        condition: service_started
        restart: true
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18080:80" # Local reverse proxy entrypoint for HTTPS frontends.

  oj-judge:
    build: ./judge
    container_name: oj-judge
    restart: always
    privileged: true
    depends_on:
      oj-backend:
        condition: service_healthy
        restart: true
    volumes:
      - ./judge/judge.yaml:/root/.hydro/judge.yaml
      - ./judge/mount.yaml:/root/.hydro/mount.yaml
